name: Build FixWANotifs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Extract, patch and build rootless DEB
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Finding FixWANotifs source"
          echo "========================================"

          # If the project is uploaded as a ZIP, extract it.
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "FixWANotifs*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"

            rm -rf build-source
            mkdir -p build-source

            unzip -o "$ZIP_FILE" -d build-source
          else
            echo "No FixWANotifs ZIP found."
            echo "Looking for already-extracted source..."
          fi

          echo ""
          echo "========================================"
          echo "Locating project Makefile"
          echo "========================================"

          PROJECT_MAKEFILE=""

          while IFS= read -r MAKEFILE; do
            if grep -q "TWEAK_NAME.*FixWANotifs" "$MAKEFILE"; then
              PROJECT_MAKEFILE="$MAKEFILE"
              break
            fi
          done < <(
            find . \
              -path "./theos" -prune -o \
              -path "./.git" -prune -o \
              -type f -name Makefile -print
          )

          if [ -z "$PROJECT_MAKEFILE" ]; then
            echo "ERROR: Could not find FixWANotifs Makefile."
            echo ""
            echo "Files available:"
            find . -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_MAKEFILE")

          echo "Found FixWANotifs project at:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo ""
          echo "========================================"
          echo "Patching for normal Dopamine rootless"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("Tweak.x")

          if not path.exists():
              raise SystemExit("ERROR: Tweak.x was not found.")

          text = path.read_text()

          # Remove RootHide-specific header.
          text = text.replace(
              '#import <roothide.h>\n',
              ''
          )

          # rootless.h is no longer required because the preference path
          # below is /var/mobile rather than a jailbreak-root path.
          text = text.replace(
              '#import <rootless.h>\n',
              ''
          )

          # Fix preference path for standard Dopamine rootless.
          text = text.replace(
              '#define FIXWA_PREFS_PATH jbroot(@"/var/mobile/Library/Preferences/com.0xkuj.fixwanotifsprefs.plist")',
              '#define FIXWA_PREFS_PATH @"/var/mobile/Library/Preferences/com.0xkuj.fixwanotifsprefs.plist"'
          )

          # Safety check.
          if "roothide.h" in text:
              raise SystemExit("ERROR: roothide.h is still present after patching.")

          if "jbroot(" in text:
              raise SystemExit("ERROR: jbroot() is still present after patching.")

          path.write_text(text)

          print("Tweak.x patched successfully.")
          print("")
          print("Current preference path:")

          for line in text.splitlines():
              if "FIXWA_PREFS_PATH" in line:
                  print(line)
          PY

          echo ""
          echo "========================================"
          echo "Cleaning previous build"
          echo "========================================"

          rm -rf packages
          rm -rf .theos

          THEOS_PACKAGE_SCHEME=rootless make clean

          echo ""
          echo "========================================"
          echo "Building rootless Dopamine package"
          echo "========================================"

          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1

          echo ""
          echo "========================================"
          echo "Checking generated packages"
          echo "========================================"

          find packages -type f -name "*.deb" -print

          DEB_COUNT=$(find packages -type f -name "*.deb" | wc -l | tr -d ' ')

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "ERROR: Build completed but no .deb was produced."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/deb-output"

          find packages -type f -name "*.deb" \
            -exec cp {} "$GITHUB_WORKSPACE/deb-output/" \;

          echo ""
          echo "DEB successfully copied to artifact folder."

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: FixWANotifs-Extended-DEB
          path: deb-output/*.deb
          if-no-files-found: error
