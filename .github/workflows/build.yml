name: Build FixWANotifications16 + Sileo Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Install Debian packaging tools
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          dpkg-deb --version

      - name: Extract FixWANotifications16 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname 'FixWANotifications16*.zip' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: No FixWANotifications16 ZIP was found in the repository.'
            exit 1
          fi

          echo "Using source: $ZIP_FILE"
          rm -rf build-source
          mkdir -p build-source
          unzip -o "$ZIP_FILE" -d build-source

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_MAKEFILE=$(find build-source \
            -type f \
            -name Makefile \
            -exec grep -l 'TWEAK_NAME.*FixWANotifications16' {} \; \
            | head -n 1)

          if [ -z "$PROJECT_MAKEFILE" ]; then
            echo 'ERROR: Could not locate the FixWANotifications16 Makefile.'
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_MAKEFILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -q '^Package: com.0xkuj.fixwanotifications16$' control
          grep -q '^Name: FixWANotifications16$' control

          grep -q 'case 40:' Tweak.x
          grep -q 'case 72:' Tweak.x
          grep -q 'case 96:' Tweak.x
          grep -q 'case 112:' Tweak.x
          grep -q 'case 128:' Tweak.x

          ! grep -q 'case 160:' Tweak.x
          ! grep -q 'case 192:' Tweak.x
          ! grep -q 'case 256:' Tweak.x

          grep -q 'PSListItemsController' \
            FixWANotifications16Prefs/Resources/Root.plist

          test -f layout/DEBIAN/postinst
          test -f layout/DEBIAN/prerm
          test -f layout/DEBIAN/postrm

          chmod +x layout/DEBIAN/postinst
          chmod +x layout/DEBIAN/prerm
          chmod +x layout/DEBIAN/postrm

          echo 'Source verification passed.'

      - name: Build rootless DEB
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          rm -rf .theos packages
          THEOS_PACKAGE_SCHEME=rootless make clean

          THEOS_PACKAGE_SCHEME=rootless \
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=6 \
          make package FINALPACKAGE=1 \
          _THEOS_PLATFORM_DPKG_DEB="$(command -v dpkg-deb)"

          DEB=$(find packages -type f -name '*.deb' | head -n 1)

          if [ -z "$DEB" ]; then
            echo 'ERROR: Theos did not generate a .deb.'
            exit 1
          fi

          echo "Generated: $DEB"
          dpkg-deb --info "$DEB"

          mkdir -p "$GITHUB_WORKSPACE/deb-output"
          cp "$DEB" "$GITHUB_WORKSPACE/deb-output/"

      - name: Upload compiled DEB
        uses: actions/upload-artifact@v4
        with:
          name: FixWANotifications16-DEB
          path: deb-output/*.deb
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download compiled DEB
        uses: actions/download-artifact@v5
        with:
          name: FixWANotifications16-DEB
          path: repo/debs

      - name: Install APT repository tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            apt-utils \
            bzip2 \
            xz-utils \
            zstd

      - name: Validate package on Linux
        shell: bash
        run: |
          set -euo pipefail

          DEB=$(find repo/debs -type f -name '*.deb' | head -n 1)

          if [ -z "$DEB" ]; then
            echo 'ERROR: Compiled .deb artifact is missing.'
            exit 1
          fi

          echo "Linux dpkg-deb validation: $DEB"
          dpkg-deb --info "$DEB"

          ARCH=$(dpkg-deb -f "$DEB" Architecture)
          PACKAGE=$(dpkg-deb -f "$DEB" Package)

          if [ "$ARCH" != 'iphoneos-arm64' ]; then
            echo "ERROR: Expected iphoneos-arm64, got $ARCH"
            exit 1
          fi

          if [ "$PACKAGE" != 'com.0xkuj.fixwanotifications16' ]; then
            echo "ERROR: Unexpected package ID: $PACKAGE"
            exit 1
          fi

          echo 'Linux package validation passed.'

      - name: Generate Sileo APT repository
        shell: bash
        run: |
          set -euo pipefail
          cd repo

          # Generate a standard flat APT package index.
          dpkg-scanpackages --multiversion debs /dev/null > Packages

          # Publish the common index compression formats used by iOS package managers.
          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9 -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst

          cat > apt-ftparchive.conf <<'EOF'
          APT::FTPArchive::Release::Origin "FixWANotifications16";
          APT::FTPArchive::Release::Label "FixWANotifications16";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "ios";
          APT::FTPArchive::Release::Architectures "iphoneos-arm64";
          APT::FTPArchive::Release::Components "main";
          APT::FTPArchive::Release::Description "FixWANotifications16 repository for Dopamine rootless iOS 16";
          EOF

          apt-ftparchive -c=apt-ftparchive.conf release . > Release
          rm apt-ftparchive.conf

          echo '----- Packages -----'
          cat Packages
          echo '----- Release -----'
          cat Release

      - name: Create repository home page
        shell: bash
        run: |
          set -euo pipefail

          OWNER="$GITHUB_REPOSITORY_OWNER"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_URL="https://${OWNER}.github.io/${REPO_NAME}/"

          cat > repo/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>FixWANotifications16 Repo</title>
            <style>
              body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 20px; line-height: 1.5; }
              code { word-break: break-all; }
            </style>
          </head>
          <body>
            <h1>FixWANotifications16</h1>
            <p>Sileo/APT repository for the Dopamine rootless iOS 16 build.</p>
            <p><strong>Memory limits:</strong> 40 / 72 / 96 / 112 / 128 MB</p>
            <p>Add this source to Sileo:</p>
            <p><code>${REPO_URL}</code></p>
          </body>
          </html>
          EOF

          touch repo/.nojekyll

      - name: Show published repository files
        shell: bash
        run: |
          set -euo pipefail
          find repo -maxdepth 2 -type f -print | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: repo

      - name: Deploy repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
