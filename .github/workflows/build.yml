name: Build FixWANotifs Extended v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Install Debian packaging tools
        shell: bash
        run: |
          set -e

          brew update
          brew install dpkg

          echo "dpkg-deb location:"
          which dpkg-deb

          echo "dpkg-deb version:"
          dpkg-deb --version

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "FixWANotifs-Extended-Jetsam-v2.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f \
              -iname "FixWANotifs*.zip" \
              | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No FixWANotifs ZIP found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          rm -rf build-source
          mkdir -p build-source

          unzip -o "$ZIP_FILE" -d build-source

      - name: Find project
        shell: bash
        run: |
          set -e

          PROJECT_MAKEFILE=$(find build-source \
            -type f \
            -name Makefile \
            -exec grep -l "TWEAK_NAME.*FixWANotifs" {} \; \
            | head -n 1)

          if [ -z "$PROJECT_MAKEFILE" ]; then
            echo "ERROR: FixWANotifs Makefile not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_MAKEFILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project:"
          echo "$PROJECT_DIR"

      - name: Verify v2 source
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          grep -q "Version: 1.1.0+extended2" control || {
            echo "ERROR: Wrong source version."
            cat control
            exit 1
          }

          grep -q "PSListItemsController" \
            FixWANotifsPrefs/Resources/Root.plist

          grep -q "case 128:" Tweak.x
          grep -q "case 160:" Tweak.x
          grep -q "case 192:" Tweak.x
          grep -q "case 256:" Tweak.x

          test -f layout/DEBIAN/postinst
          test -f layout/DEBIAN/prerm
          test -f layout/DEBIAN/postrm

          chmod +x layout/DEBIAN/postinst
          chmod +x layout/DEBIAN/prerm
          chmod +x layout/DEBIAN/postrm

          echo "Source checks passed."

      - name: Build with real dpkg-deb
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .theos
          rm -rf packages

          echo "Cleaning..."
          THEOS_PACKAGE_SCHEME=rootless make clean

          echo ""
          echo "Building using Debian dpkg-deb..."

          THEOS_PACKAGE_SCHEME=rootless \
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=6 \
          make package FINALPACKAGE=1 \
          _THEOS_PLATFORM_DPKG_DEB="$(which dpkg-deb)"

          echo ""
          echo "Generated package:"

          find packages -type f -name "*.deb" -print

      - name: Validate with dpkg-deb
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          DEB=$(find packages -type f -name "*.deb" | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: No DEB generated."
            exit 1
          fi

          echo "========================================"
          echo "VALIDATING DEB WITH DEBIAN DPKG-DEB"
          echo "========================================"

          echo ""
          echo "Package:"
          echo "$DEB"

          echo ""
          echo "Package metadata:"
          dpkg-deb --info "$DEB"

          echo ""
          echo "Package contents:"
          dpkg-deb --contents "$DEB"

          echo ""
          echo "Testing extraction..."

          TEST_DIR=$(mktemp -d)

          dpkg-deb --extract "$DEB" "$TEST_DIR/data"
          dpkg-deb --control "$DEB" "$TEST_DIR/control"

          echo ""
          echo "Control files:"
          find "$TEST_DIR/control" -type f -maxdepth 1 -print

          test -f "$TEST_DIR/control/control" || {
            echo "ERROR: control file missing."
            exit 1
          }

          test -f "$TEST_DIR/control/prerm" || {
            echo "ERROR: prerm missing."
            exit 1
          }

          test -f "$TEST_DIR/control/postrm" || {
            echo "ERROR: postrm missing."
            exit 1
          }

          echo ""
          echo "prerm: FOUND"
          echo "postrm: FOUND"

          echo ""
          echo "========================================"
          echo "DPKG-DEB VALIDATION PASSED"
          echo "========================================"

          mkdir -p "$GITHUB_WORKSPACE/deb-output"

          cp "$DEB" "$GITHUB_WORKSPACE/deb-output/"

          ls -lh "$GITHUB_WORKSPACE/deb-output/"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: FixWANotifs-Extended-v2-DPKG
          path: deb-output/*.deb
          if-no-files-found: error
