name: Build FixWANotifs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Extract, patch and build rootless DEB
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Finding FixWANotifs source"
          echo "========================================"

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "FixWANotifs*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"

            rm -rf build-source
            mkdir -p build-source

            unzip -o "$ZIP_FILE" -d build-source
          else
            echo "No ZIP found - looking for extracted source."
          fi

          echo ""
          echo "========================================"
          echo "Locating FixWANotifs Makefile"
          echo "========================================"

          PROJECT_MAKEFILE=""

          while IFS= read -r MAKEFILE; do
            if grep -q "TWEAK_NAME.*FixWANotifs" "$MAKEFILE"; then
              PROJECT_MAKEFILE="$MAKEFILE"
              break
            fi
          done < <(
            find . \
              -path "./theos" -prune -o \
              -path "./.git" -prune -o \
              -type f -name Makefile -print
          )

          if [ -z "$PROJECT_MAKEFILE" ]; then
            echo "ERROR: Could not find FixWANotifs project."
            find . -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_MAKEFILE")

          echo "Found project:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo ""
          echo "========================================"
          echo "Patching tweak for standard Dopamine"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import re

          # -------------------------------------------------
          # Patch main tweak
          # -------------------------------------------------

          tweak = Path("Tweak.x")

          if not tweak.exists():
              raise SystemExit("ERROR: Tweak.x not found")

          text = tweak.read_text()

          # Remove RootHide / Theos root path headers.
          text = text.replace('#import <roothide.h>\n', '')
          text = text.replace('#include <roothide.h>\n', '')
          text = text.replace('#import <rootless.h>\n', '')
          text = text.replace('#include <rootless.h>\n', '')

          # Replace the preference path definition regardless of whitespace.
          text = re.sub(
              r'#define\s+FIXWA_PREFS_PATH\s+jbroot\(@"/var/mobile/Library/Preferences/com\.0xkuj\.fixwanotifsprefs\.plist"\)',
              '#define FIXWA_PREFS_PATH @"/var/mobile/Library/Preferences/com.0xkuj.fixwanotifsprefs.plist"',
              text
          )

          tweak.write_text(text)

          print("Patched Tweak.x")

          # -------------------------------------------------
          # Patch preference bundle
          # -------------------------------------------------

          prefs = Path("FixWANotifsPrefs/FWARootListController.m")

          if not prefs.exists():
              raise SystemExit(
                  "ERROR: FixWANotifsPrefs/FWARootListController.m not found"
              )

          ptext = prefs.read_text()

          # Remove RootHide/rootless development headers.
          ptext = ptext.replace('#import <roothide.h>\n', '')
          ptext = ptext.replace('#include <roothide.h>\n', '')
          ptext = ptext.replace('#import <rootless.h>\n', '')
          ptext = ptext.replace('#include <rootless.h>\n', '')

          # Standard Dopamine rootless jailbreak root.
          ptext = ptext.replace(
              'jbroot(@"/usr/bin/ldrestart").UTF8String',
              '"/var/jb/usr/bin/ldrestart"'
          )

          prefs.write_text(ptext)

          print("Patched FWARootListController.m")

          # -------------------------------------------------
          # Verify important changes
          # -------------------------------------------------

          final_tweak = tweak.read_text()
          final_prefs = prefs.read_text()

          if '#import <roothide.h>' in final_tweak:
              raise SystemExit("ERROR: roothide.h remains in Tweak.x")

          if '#include <roothide.h>' in final_tweak:
              raise SystemExit("ERROR: roothide.h remains in Tweak.x")

          if '#import <roothide.h>' in final_prefs:
              raise SystemExit("ERROR: roothide.h remains in preference bundle")

          if '#include <roothide.h>' in final_prefs:
              raise SystemExit("ERROR: roothide.h remains in preference bundle")

          if 'FIXWA_PREFS_PATH jbroot(' in final_tweak:
              raise SystemExit("ERROR: preference jbroot() call was not replaced")

          if 'jbroot(@"/usr/bin/ldrestart")' in final_prefs:
              raise SystemExit("ERROR: ldrestart jbroot() call was not replaced")

          print("")
          print("Patch verification successful.")
          print("")
          print("Relevant Tweak.x lines:")

          for line in final_tweak.splitlines():
              if "FIXWA_PREFS_PATH" in line:
                  print(line)

          print("")
          print("Relevant preference bundle lines:")

          for line in final_prefs.splitlines():
              if "ldrestart" in line:
                  print(line)
          PY

          echo ""
          echo "========================================"
          echo "Cleaning old build"
          echo "========================================"

          rm -rf packages
          rm -rf .theos

          THEOS_PACKAGE_SCHEME=rootless make clean

          echo ""
          echo "========================================"
          echo "Building FixWANotifs"
          echo "========================================"

          THEOS_PACKAGE_SCHEME=rootless \
            make package FINALPACKAGE=1

          echo ""
          echo "========================================"
          echo "Checking generated DEB"
          echo "========================================"

          find packages -type f -name "*.deb" -print

          DEB_COUNT=$(find packages -type f -name "*.deb" | wc -l | tr -d ' ')

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "ERROR: Build finished but no DEB was produced."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/deb-output"

          find packages \
            -type f \
            -name "*.deb" \
            -exec cp {} "$GITHUB_WORKSPACE/deb-output/" \;

          echo ""
          echo "========================================"
          echo "SUCCESS - DEB ready"
          echo "========================================"

          ls -lh "$GITHUB_WORKSPACE/deb-output"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: FixWANotifs-Extended-DEB
          path: deb-output/*.deb
          if-no-files-found: error
