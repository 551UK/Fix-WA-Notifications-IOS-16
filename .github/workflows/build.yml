name: Build FixWANotifs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Extract, patch and build rootless DEB
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "FixWANotifs*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            rm -rf build-source
            mkdir -p build-source
            unzip -o "$ZIP_FILE" -d build-source
          fi

          PROJECT_MAKEFILE=""

          while IFS= read -r MAKEFILE; do
            if grep -q "TWEAK_NAME.*FixWANotifs" "$MAKEFILE"; then
              PROJECT_MAKEFILE="$MAKEFILE"
              break
            fi
          done < <(
            find . \
              -path "./theos" -prune -o \
              -path "./.git" -prune -o \
              -type f -name Makefile -print
          )

          if [ -z "$PROJECT_MAKEFILE" ]; then
            echo "ERROR: Could not find FixWANotifs project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_MAKEFILE")

          echo "Found project: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          tweak = Path("Tweak.x")
          text = tweak.read_text()

          text = text.replace('#import <roothide.h>\n', '')
          text = text.replace('#include <roothide.h>\n', '')
          text = text.replace('#import <rootless.h>\n', '')
          text = text.replace('#include <rootless.h>\n', '')

          text = re.sub(
              r'#define\s+FIXWA_PREFS_PATH\s+jbroot\(@"/var/mobile/Library/Preferences/com\.0xkuj\.fixwanotifsprefs\.plist"\)',
              '#define FIXWA_PREFS_PATH @"/var/mobile/Library/Preferences/com.0xkuj.fixwanotifsprefs.plist"',
              text
          )

          tweak.write_text(text)

          prefs = Path("FixWANotifsPrefs/FWARootListController.m")
          ptext = prefs.read_text()

          ptext = ptext.replace('#import <roothide.h>\n', '')
          ptext = ptext.replace('#include <roothide.h>\n', '')
          ptext = ptext.replace('#import <rootless.h>\n', '')
          ptext = ptext.replace('#include <rootless.h>\n', '')

          ptext = ptext.replace(
              'jbroot(@"/usr/bin/ldrestart").UTF8String',
              '"/var/jb/usr/bin/ldrestart"'
          )

          prefs.write_text(ptext)

          print("Source patched successfully.")
          PY

          rm -rf packages
          rm -rf .theos

          echo "Cleaning..."
          THEOS_PACKAGE_SCHEME=rootless make clean

          echo "Building with gzip DEB compression..."

          THEOS_PACKAGE_SCHEME=rootless \
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=6 \
          make package FINALPACKAGE=1

          DEB=$(find packages -type f -name "*.deb" | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: No DEB was generated."
            exit 1
          fi

          echo "Generated:"
          ls -lh "$DEB"

          echo ""
          echo "Checking Debian archive magic..."

          python3 - "$DEB" <<'PY'
          import sys
          from pathlib import Path

          deb = Path(sys.argv[1])
          data = deb.read_bytes()

          if len(data) < 8:
              raise SystemExit("ERROR: DEB is too small.")

          if data[:8] != b"!<arch>\n":
              raise SystemExit(
                  f"ERROR: Invalid DEB header: {data[:16]!r}"
              )

          print("Valid Debian ar magic: !<arch>")

          pos = 8
          members = []

          while pos + 60 <= len(data):
              header = data[pos:pos+60]

              if header[58:60] != b"`\n":
                  raise SystemExit(
                      f"ERROR: Invalid archive member header at byte {pos}"
                  )

              name = header[:16].decode(
                  "ascii",
                  errors="replace"
              ).strip().rstrip("/")

              size_text = header[48:58].decode(
                  "ascii",
                  errors="strict"
              ).strip()

              size = int(size_text)
              members.append(name)

              pos += 60 + size

              if pos % 2:
                  pos += 1

          print("Archive members:")
          for member in members:
              print(" -", member)

          required = {
              "debian-binary",
          }

          if not required.issubset(set(members)):
              raise SystemExit(
                  "ERROR: Missing debian-binary member."
              )

          if not any(x.startswith("control.tar") for x in members):
              raise SystemExit(
                  "ERROR: Missing control.tar member."
              )

          if not any(x.startswith("data.tar") for x in members):
              raise SystemExit(
                  "ERROR: Missing data.tar member."
              )

          print("DEB archive structure is valid.")
          PY

          echo ""
          echo "Checking expected gzip members..."

          /usr/bin/ar t "$DEB"

          mkdir -p "$GITHUB_WORKSPACE/deb-output"
          cp "$DEB" "$GITHUB_WORKSPACE/deb-output/"

          echo ""
          echo "Finished package:"
          ls -lh "$GITHUB_WORKSPACE/deb-output/"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: FixWANotifs-Extended-DEB-GZIP
          path: deb-output/*.deb
          if-no-files-found: error
