name: Build FixWANotifs Extended v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for FixWANotifs v2 ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "FixWANotifs-Extended-Jetsam-v2.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Exact v2 filename not found."
            echo "Trying any FixWANotifs ZIP..."

            ZIP_FILE=$(find . -maxdepth 3 -type f \
              -iname "FixWANotifs*.zip" \
              | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No FixWANotifs ZIP found."
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          rm -rf build-source
          mkdir -p build-source

          unzip -o "$ZIP_FILE" -d build-source

          echo ""
          echo "Extracted files:"
          find build-source -maxdepth 3 -type f

      - name: Find project
        shell: bash
        run: |
          set -e

          PROJECT_MAKEFILE=$(find build-source \
            -type f \
            -name Makefile \
            -exec grep -l "TWEAK_NAME.*FixWANotifs" {} \; \
            | head -n 1)

          if [ -z "$PROJECT_MAKEFILE" ]; then
            echo "ERROR: FixWANotifs Makefile not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_MAKEFILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project at:"
          echo "$PROJECT_DIR"

      - name: Verify v2 source
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking version..."

          grep -q "Version: 1.1.0+extended2" control || {
            echo "ERROR: This is not the extended2 source."
            cat control
            exit 1
          }

          echo "Checking Memory Limit selector..."

          grep -q "PSListItemsController" \
            FixWANotifsPrefs/Resources/Root.plist || {
            echo "ERROR: Memory Limit selector fix is missing."
            exit 1
          }

          grep -q "<integer>128</integer>" \
            FixWANotifsPrefs/Resources/Root.plist

          grep -q "<integer>160</integer>" \
            FixWANotifsPrefs/Resources/Root.plist

          grep -q "<integer>192</integer>" \
            FixWANotifsPrefs/Resources/Root.plist

          grep -q "<integer>256</integer>" \
            FixWANotifsPrefs/Resources/Root.plist

          echo "Checking tweak limits..."

          grep -q "case 128:" Tweak.x
          grep -q "case 160:" Tweak.x
          grep -q "case 192:" Tweak.x
          grep -q "case 256:" Tweak.x

          echo "Checking uninstall scripts..."

          test -f layout/DEBIAN/prerm
          test -f layout/DEBIAN/postrm
          test -f layout/DEBIAN/postinst

          chmod +x layout/DEBIAN/prerm
          chmod +x layout/DEBIAN/postrm
          chmod +x layout/DEBIAN/postinst

          echo ""
          echo "v2 source verification successful."

      - name: Clean build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .theos
          rm -rf packages

          THEOS_PACKAGE_SCHEME=rootless make clean

      - name: Build rootless package
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building FixWANotifs Extended v2..."

          THEOS_PACKAGE_SCHEME=rootless \
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=6 \
          make package FINALPACKAGE=1

          echo ""
          echo "Generated packages:"

          find packages -type f -name "*.deb" -print

      - name: Verify DEB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          DEB=$(find packages -type f -name "*.deb" | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: No .deb generated."
            exit 1
          fi

          echo "Checking:"
          echo "$DEB"

          echo ""
          echo "DEB archive members:"

          ar t "$DEB"

          ar t "$DEB" | grep -q "^debian-binary$" || {
            echo "ERROR: debian-binary missing."
            exit 1
          }

          ar t "$DEB" | grep -q "^control.tar" || {
            echo "ERROR: control archive missing."
            exit 1
          }

          ar t "$DEB" | grep -q "^data.tar" || {
            echo "ERROR: data archive missing."
            exit 1
          }

          echo ""
          echo "Checking package metadata..."

          dpkg-deb -I "$DEB" || true

          echo ""
          echo "Checking package contents..."

          dpkg-deb -c "$DEB" || true

          echo ""
          echo "Checking uninstall scripts are inside the DEB..."

          TEMP_DIR=$(mktemp -d)

          dpkg-deb -e "$DEB" "$TEMP_DIR"

          test -f "$TEMP_DIR/postrm" || {
            echo "ERROR: postrm missing from finished DEB."
            exit 1
          }

          test -f "$TEMP_DIR/prerm" || {
            echo "ERROR: prerm missing from finished DEB."
            exit 1
          }

          echo "postrm and prerm are present."

          mkdir -p "$GITHUB_WORKSPACE/deb-output"

          cp "$DEB" "$GITHUB_WORKSPACE/deb-output/"

          echo ""
          echo "Finished package:"
          ls -lh "$GITHUB_WORKSPACE/deb-output"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: FixWANotifs-Extended-v2-DEB
          path: deb-output/*.deb
          if-no-files-found: error
