name: Build FixWANotifs

on:
  workflow_dispatch:
  push:
    branches:
      
main

jobs:
  build:
    runs-on: macos-latest

    steps:
      
name: Checkout source
      uses: actions/checkout@v4

      
name: Install Theos
      uses: beerpiss/theos-action@v1
      with:
        theos-sdks: https://github.com/theos/sdks

      
name: Build rootless DEB
      run: |
        rm -rf packages
        make clean
        THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1

      
name: Upload DEB
      uses: actions/upload-artifact@v4
      with:
        name: FixWANotifs-Extended-DEB
        path: packages/*.deb
        if-no-files-found: error
