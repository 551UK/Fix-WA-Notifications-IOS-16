name: Build FixWANotifications16

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Install Debian packaging tools
        shell: bash
        run: |
          set -e
          brew install dpkg
          dpkg-deb --version

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "FixWANotifications16*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No FixWANotifications16 ZIP found."
            exit 1
          fi

          rm -rf build-source
          mkdir -p build-source
          unzip -o "$ZIP_FILE" -d build-source

      - name: Locate project
        shell: bash
        run: |
          set -e

          PROJECT_MAKEFILE=$(find build-source \
            -type f \
            -name Makefile \
            -exec grep -l "TWEAK_NAME.*FixWANotifications16" {} \; \
            | head -n 1)

          if [ -z "$PROJECT_MAKEFILE" ]; then
            echo "ERROR: FixWANotifications16 Makefile not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_MAKEFILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Verify source
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          grep -q '^Package: com.0xkuj.fixwanotifications16$' control
          grep -q '^Name: FixWANotifications16$' control
          grep -q '^Version: 1.0.0$' control

          grep -q 'case 112:' Tweak.x
          grep -q 'case 128:' Tweak.x

          ! grep -q 'case 160:' Tweak.x
          ! grep -q 'case 192:' Tweak.x
          ! grep -q 'case 256:' Tweak.x

          grep -q '<integer>112</integer>' FixWANotifications16Prefs/Resources/Root.plist
          grep -q '<integer>128</integer>' FixWANotifications16Prefs/Resources/Root.plist

          test -f layout/DEBIAN/postinst
          test -f layout/DEBIAN/prerm
          test -f layout/DEBIAN/postrm

          chmod +x layout/DEBIAN/postinst
          chmod +x layout/DEBIAN/prerm
          chmod +x layout/DEBIAN/postrm

          echo "Source verification passed."

      - name: Build rootless DEB
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          rm -rf .theos packages
          THEOS_PACKAGE_SCHEME=rootless make clean

          THEOS_PACKAGE_SCHEME=rootless \
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=6 \
          make package FINALPACKAGE=1 \
          _THEOS_PLATFORM_DPKG_DEB="$(which dpkg-deb)"

          find packages -type f -name '*.deb' -print

      - name: Validate DEB
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          DEB=$(find packages -type f -name '*.deb' | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: No .deb generated."
            exit 1
          fi

          dpkg-deb --info "$DEB"

          TEST_DIR=$(mktemp -d)
          dpkg-deb --extract "$DEB" "$TEST_DIR/data"
          dpkg-deb --control "$DEB" "$TEST_DIR/control"

          test -f "$TEST_DIR/control/control"
          test -f "$TEST_DIR/control/prerm"
          test -f "$TEST_DIR/control/postrm"

          mkdir -p "$GITHUB_WORKSPACE/deb-output"
          cp "$DEB" "$GITHUB_WORKSPACE/deb-output/"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: FixWANotifications16-DEB
          path: deb-output/*.deb
          if-no-files-found: error
